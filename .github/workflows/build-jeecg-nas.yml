name: Build JeecgBoot NAS images

# 手动触发：在 GitHub 托管 runner 上云端编译后端 Spring Boot jar 与前端 Vue3 dist，
# 打包成 2 个 Docker 镜像推送到 ghcr.io，供飞牛 fnOS（无外网 Docker 出口、不做本地编译）直接拉取。
# 中间件（mysql/redis/pgvector）由 NAS 侧从 aliyuncs 拉取，不进此 workflow。
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # ---------- 后端：Maven 编译 fat jar ----------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend jar (mvn -Pdocker)
        run: |
          cd jeecg-boot
          mvn -B clean package -Pdocker -DskipTests -Dmaven.test.skip=true
          # 组装后端构建上下文（jar + Dockerfile）
          mkdir -p /tmp/jbctx/backend
          cp jeecg-module-system/jeecg-system-start/target/jeecg-system-start-3.9.5.jar /tmp/jbctx/backend/jeecg-system-start.jar
          cp "$GITHUB_WORKSPACE/deploy/Dockerfile.backend" /tmp/jbctx/backend/Dockerfile
          ls -lh /tmp/jbctx/backend/

      # ---------- 前端：pnpm 编译 dist ----------
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend dist (pnpm build:docker)
        working-directory: jeecgboot-vue3
        run: |
          pnpm install
          pnpm run build:docker
          # 组装前端构建上下文（dist + nginx.conf + Dockerfile）
          mkdir -p /tmp/jbctx/frontend
          cp -r dist /tmp/jbctx/frontend/dist
          cp "$GITHUB_WORKSPACE/deploy/nginx.conf" /tmp/jbctx/frontend/nginx.conf
          cp "$GITHUB_WORKSPACE/deploy/Dockerfile.frontend" /tmp/jbctx/frontend/Dockerfile
          ls /tmp/jbctx/frontend/

      # ---------- 推镜像到 ghcr ----------
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: /tmp/jbctx/backend
          push: true
          tags: ghcr.io/253628631/jeecg-boot-system:nas-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: /tmp/jbctx/frontend
          push: true
          tags: ghcr.io/253628631/jeecgboot-vue3:nas-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
