server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html index.htm;
  charset utf-8;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # API 反代到后端容器（docker 内嵌 DNS，避免后端重启换 IP 后 nginx 缓存旧 IP）
  location /jeecgboot/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $jeecg_system jeecg-boot-system;
    rewrite ^/jeecgboot/?(.*)$ /jeecg-boot/$1 break;
    proxy_pass http://$jeecg_system:8080;
    proxy_redirect off;
    # Host 带端口：否则后端 getBaseUrl 拿到默认 80 端口，AI 插件等自调用失败（官方 issue 9358）
    proxy_set_header Host jeecg-boot-system:8080;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 20m;
  }

  # history 路由刷新兜底
  location / {
    try_files $uri $uri/ /index.html;
  }

  error_page 500 502 503 504 /50x.html;
}
